{{- if .Values.mlflow.enabled }}
{{- $secretName := printf "%s-mlflow-db" (include "activault.fullname" .) -}}
{{- $prevSecret := (lookup "v1" "Secret" .Release.Namespace $secretName) | default dict -}}
{{- $prevData := $prevSecret.data | default dict -}}
{{- $prevPassword := index $prevData "POSTGRES_PASSWORD" | default "" | b64dec -}}
{{- $password := .Values.postgres.password | default $prevPassword | default (randAlphaNum 32) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ $password | quote }}
  POSTGRES_USER: "mlflow"
  POSTGRES_DB: "mlflow"
{{- end }}
