{{- $secretName := printf "%s-s3-creds" (include "activault.fullname" .) -}}
{{- $prevSecret := (lookup "v1" "Secret" .Release.Namespace $secretName) | default dict -}}
{{- $prevData := $prevSecret.data | default dict -}}
{{- $prevAccessKey := index $prevData "AWS_ACCESS_KEY_ID" | default "" | b64dec -}}
{{- $prevSecretKey := index $prevData "AWS_SECRET_ACCESS_KEY" | default "" | b64dec -}}
{{- $accessKey := .Values.s3.accessKey | default $prevAccessKey | default (randAlphaNum 26) -}}
{{- $secretKey := .Values.s3.secretKey | default $prevSecretKey | default (randAlphaNum 64) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: {{ $accessKey | quote }}
  AWS_SECRET_ACCESS_KEY: {{ $secretKey | quote }}
  AWS_ENDPOINT_URL: {{ .Values.s3.endpoint | quote }}
  S3_ENDPOINT_URL: {{ .Values.s3.endpoint | quote }}
  AWS_DEFAULT_REGION: {{ .Values.s3.region | quote }}
