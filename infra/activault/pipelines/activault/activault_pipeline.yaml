# PIPELINE DEFINITION
# Name: activault-collect
# Inputs:
#    batch_size: int [Default: 64.0]
#    batches_per_upload: int [Default: 4.0]
#    bucket_name: str [Default: 'activations']
#    dataset: str [Default: 'monology/pile-uncopyrighted']
#    dtype: str [Default: 'bfloat16']
#    hooks: str [Default: 'models.layers.13.self_attn.post,models.layers.13.mlp.post']
#    model_name: str [Default: 'google/gemma-2-2b-it']
#    n_batches: int [Default: 3600.0]
#    run_name: str [Default: 'gemma2_2b']
#    seed: int [Default: 42.0]
#    seq_length: int [Default: 256.0]
#    start_batch: int [Default: 0.0]
components:
  comp-activault-collect:
    executorLabel: exec-activault-collect
    inputDefinitions:
      parameters:
        batch_size:
          parameterType: NUMBER_INTEGER
        batches_per_upload:
          parameterType: NUMBER_INTEGER
        bucket_name:
          parameterType: STRING
        dataset:
          parameterType: STRING
        dtype:
          parameterType: STRING
        hooks:
          parameterType: STRING
        model_name:
          parameterType: STRING
        n_batches:
          parameterType: NUMBER_INTEGER
        run_name:
          parameterType: STRING
        seed:
          parameterType: NUMBER_INTEGER
        seq_length:
          parameterType: NUMBER_INTEGER
        start_batch:
          parameterType: NUMBER_INTEGER
deploymentSpec:
  executors:
    exec-activault-collect:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - activault_collect
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'kfp==2.16.0'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef activault_collect(\n    run_name: str,\n    model_name: str,\n\
          \    dtype: str,\n    n_batches: int,\n    seq_length: int,\n    batch_size:\
          \ int,\n    seed: int,\n    start_batch: int,\n    batches_per_upload: int,\n\
          \    hooks: str,\n    bucket_name: str,\n    dataset: str,\n):\n    \"\"\
          \"Generate config.yaml from parameters and run activault collect.\"\"\"\n\
          \    import subprocess\n    import yaml\n\n    cfg = {\n        'run_name':\
          \ run_name,\n        'num_runs': 1,\n        'transformer_config': {\n \
          \           'model_name': model_name,\n            'dtype': dtype,\n   \
          \         'cache_dir': '/cache',\n            'max_per_device_memory': '24GB',\n\
          \        },\n        'data_config': {\n            'bucket_name': bucket_name,\n\
          \            'data_key': dataset,\n            'n_batches': n_batches,\n\
          \            'seq_length': seq_length,\n            'batch_size': batch_size,\n\
          \            'seed': seed,\n            'skip_cache': False,\n         \
          \   'start_batch': start_batch,\n            'clean_added_tokens': False,\n\
          \            'clean_default_system_prompt': False,\n        },\n       \
          \ 'upload_config': {\n            'batches_per_upload': batches_per_upload,\n\
          \            'hooks': hooks.split(','),\n        },\n    }\n\n    with open('/tmp/config.yaml',\
          \ 'w') as f:\n        yaml.dump(cfg, f)\n\n    subprocess.run(\n       \
          \ ['activault', 'collect', '--config', '/tmp/config.yaml'],\n        check=True,\n\
          \    )\n\n"
        image: activault-flashattn:latest
        resources:
          accelerator:
            count: '1'
            resourceCount: '1'
            resourceType: nvidia.com/gpu
            type: nvidia.com/gpu
          memoryLimit: 34.359738368
          memoryRequest: 17.179869184
          resourceMemoryLimit: 32Gi
          resourceMemoryRequest: 16Gi
pipelineInfo:
  name: activault-collect
root:
  dag:
    tasks:
      activault-collect:
        cachingOptions: {}
        componentRef:
          name: comp-activault-collect
        inputs:
          parameters:
            batch_size:
              componentInputParameter: batch_size
            batches_per_upload:
              componentInputParameter: batches_per_upload
            bucket_name:
              componentInputParameter: bucket_name
            dataset:
              componentInputParameter: dataset
            dtype:
              componentInputParameter: dtype
            hooks:
              componentInputParameter: hooks
            model_name:
              componentInputParameter: model_name
            n_batches:
              componentInputParameter: n_batches
            run_name:
              componentInputParameter: run_name
            seed:
              componentInputParameter: seed
            seq_length:
              componentInputParameter: seq_length
            start_batch:
              componentInputParameter: start_batch
        retryPolicy:
          backoffDuration: 0s
          backoffFactor: 2.0
          backoffMaxDuration: 3600s
        taskInfo:
          name: activault-collect
  inputDefinitions:
    parameters:
      batch_size:
        defaultValue: 64.0
        isOptional: true
        parameterType: NUMBER_INTEGER
      batches_per_upload:
        defaultValue: 4.0
        isOptional: true
        parameterType: NUMBER_INTEGER
      bucket_name:
        defaultValue: activations
        isOptional: true
        parameterType: STRING
      dataset:
        defaultValue: monology/pile-uncopyrighted
        isOptional: true
        parameterType: STRING
      dtype:
        defaultValue: bfloat16
        isOptional: true
        parameterType: STRING
      hooks:
        defaultValue: models.layers.13.self_attn.post,models.layers.13.mlp.post
        isOptional: true
        parameterType: STRING
      model_name:
        defaultValue: google/gemma-2-2b-it
        isOptional: true
        parameterType: STRING
      n_batches:
        defaultValue: 3600.0
        isOptional: true
        parameterType: NUMBER_INTEGER
      run_name:
        defaultValue: gemma2_2b
        isOptional: true
        parameterType: STRING
      seed:
        defaultValue: 42.0
        isOptional: true
        parameterType: NUMBER_INTEGER
      seq_length:
        defaultValue: 256.0
        isOptional: true
        parameterType: NUMBER_INTEGER
      start_batch:
        defaultValue: 0.0
        isOptional: true
        parameterType: NUMBER_INTEGER
schemaVersion: 2.1.0
sdkVersion: kfp-2.16.0
---
platforms:
  kubernetes:
    deploymentSpec:
      executors:
        exec-activault-collect:
          activeDeadlineSeconds: '259200'
          emptyDirMounts:
          - medium: Memory
            mountPath: /dev/shm
            sizeLimit: 16Gi
            volumeName: dshm
          imagePullPolicy: Never
          podMetadata:
            annotations:
              cluster-autoscaler.kubernetes.io/safe-to-evict: 'false'
          secretAsEnv:
          - keyToEnv:
            - envVar: AWS_ACCESS_KEY_ID
              secretKey: AWS_ACCESS_KEY_ID
            - envVar: AWS_SECRET_ACCESS_KEY
              secretKey: AWS_SECRET_ACCESS_KEY
            - envVar: AWS_ENDPOINT_URL
              secretKey: AWS_ENDPOINT_URL
            - envVar: AWS_DEFAULT_REGION
              secretKey: AWS_DEFAULT_REGION
            optional: false
            secretName: activault-s3-creds
            secretNameParameter:
              runtimeValue:
                constant: activault-s3-creds
          - keyToEnv:
            - envVar: S3_ENDPOINT_URL
              secretKey: AWS_ENDPOINT_URL
            optional: false
            secretName: activault-s3-creds
            secretNameParameter:
              runtimeValue:
                constant: activault-s3-creds
          - keyToEnv:
            - envVar: HF_TOKEN
              secretKey: token
            optional: false
            secretName: hf-token-secret
            secretNameParameter:
              runtimeValue:
                constant: hf-token-secret
          tolerations:
          - effect: NoSchedule
            key: nvidia.com/gpu
            operator: Exists
