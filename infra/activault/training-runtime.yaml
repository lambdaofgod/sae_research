apiVersion: trainer.kubeflow.org/v1alpha1
kind: ClusterTrainingRuntime
metadata:
  name: sae-single-gpu
  labels:
    trainer.kubeflow.org/framework: torch
spec:
  mlPolicy:
    numNodes: 1
  template:
    spec:
      replicatedJobs:
        - name: node
          template:
            metadata:
              labels:
                trainer.kubeflow.org/trainjob-ancestor-step: trainer
            spec:
              template:
                metadata:
                  annotations:
                    cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
                spec:
                  tolerations:
                    - key: nvidia.com/gpu
                      operator: Exists
                      effect: NoSchedule
                  containers:
                    - name: node
                      image: sae-training:latest
                      imagePullPolicy: Never
                      resources:
                        requests:
                          memory: "16Gi"
                        limits:
                          nvidia.com/gpu: "1"
                          memory: "32Gi"
                      envFrom:
                        - secretRef:
                            name: activault-s3-creds
                      env:
                        - name: HF_TOKEN
                          valueFrom:
                            secretKeyRef:
                              name: hf-token-secret
                              key: token
                        - name: MLFLOW_TRACKING_URI
                          value: "http://activault-mlflow.default.svc:5000"
                        - name: MLFLOW_S3_ENDPOINT_URL
                          value: "http://activault-garage.default:3900"
                        - name: PYTORCH_CUDA_ALLOC_CONF
                          value: "expandable_segments:True"
                      volumeMounts:
                        - name: dshm
                          mountPath: /dev/shm
                  volumes:
                    - name: dshm
                      emptyDir:
                        medium: Memory
                        sizeLimit: "16Gi"
