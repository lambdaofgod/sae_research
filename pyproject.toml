[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sae-research"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "dictionary-learning",
    "dotenv>=0.9.9",
    "dvc-gs>=3.0.2",
    "dvc>=3.63.0",
    "fire>=0.7.1",
    "ipywidgets>=8.1.7",
    "matplotlib>=3.10.6",
    "nbformat>=5.10.4",
    "numba>=0.62.1",
    "odfpy>=1.4.1",
    "openpyxl>=3.1.5",
    "pandas>=2.3.2",
    "pyamg>=5.3.0",
    "sae-bench==0.6.0",
    "sae-lens==6.43.0",
    "scikit-learn>=1.7.1",
    "seaborn>=0.13.2",
    "sentence-transformers>=5.1.2",
    "sympy>=1.14.0",
    "tabulate>=0.9.0",
    "einops>=0.7.0",
    "jaxtyping>=0.2.0",
    "zstandard>=0.22.0",
    "boto3>=1.42.77",
    "pyyaml>=6.0.3",
    "mlflow>=3.10.1",
    "kfp>=2.16.0",
    "kfp-kubernetes>=2.16.0",
    "ipykernel>=7.0.1",
    "pydantic>=2.11.10",
    "transformers==5.7.0",
]

[dependency-groups]
dev = [
    "ipykernel>=6.30.1",
    "pre-commit>=4.5.1",
    "pyrefly>=0.59.1",
    "ruff>=0.15.9",
]

[project.scripts]
find_sae_bench_models = "scripts.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["sae_research"]

[tool.uv]
# sae-probes 0.4.0 caps transformer-lens<3.0.0, but TL 2.x uses
# GPTNeoXConfig.rotary_pct which transformers 5 removed. TL 3.x is
# API-compatible with sae-probes' usage at runtime, so override.
override-dependencies = [
    "transformer-lens>=3.0.0",
]

[tool.uv.sources]
dictionary-learning = { git = "https://github.com/saprmarks/dictionary_learning", rev = "1d2737a" }

[tool.uv.workspace]
members = [
    "ARENA_tutorials"
]
