repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]

      - id: pyrefly
        name: pyrefly type check
        entry: uv run pyrefly check
        language: system
        pass_filenames: false
        types: [python]
