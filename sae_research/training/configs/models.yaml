# Model configurations for SAE training.
# Each key is a HuggingFace model name.

EleutherAI/pythia-70m-deduped:
  llm_batch_size: 128
  context_length: 128
  sae_batch_size: 2048
  dtype: float16

EleutherAI/pythia-160m-deduped:
  llm_batch_size: 32
  context_length: 1024
  sae_batch_size: 2048
  dtype: float32

google/gemma-2-2b:
  llm_batch_size: 4
  context_length: 1024
  sae_batch_size: 2048
  dtype: bfloat16

google/gemma-2-2b-it:
  llm_batch_size: 4
  context_length: 256
  sae_batch_size: 2048
  dtype: bfloat16
  activault:
    s3_prefix: gemma2_2b/models.layers.13.mlp.post
    s3_bucket: activations
    s3_buffer_size: 2
    s3_workers: 2

Qwen/Qwen2.5-Coder-32B-Instruct:
  llm_batch_size: 4
  context_length: 2048
  sae_batch_size: 2048
  dtype: bfloat16

Qwen/Qwen3-8B:
  llm_batch_size: 16
  context_length: 2048
  sae_batch_size: 2048
  dtype: bfloat16

Qwen/Qwen3-14B:
  llm_batch_size: 8
  context_length: 2048
  sae_batch_size: 2048
  dtype: bfloat16

Qwen/Qwen3-32B:
  llm_batch_size: 2
  context_length: 2048
  sae_batch_size: 2048
  dtype: bfloat16
